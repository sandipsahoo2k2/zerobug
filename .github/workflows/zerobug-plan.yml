name: ZeroBug plan

# The dashboard matches runs by this name, so the Jira ID must stay in it.
run-name: "ZeroBug ${{ inputs.jira_id }} (${{ inputs.mode }})"

on:
  workflow_dispatch:
    inputs:
      jira_id:
        description: "Jira issue key, e.g. ZB-123"
        required: true
        type: string
      mode:
        description: "plan = analyse, publish = write the plan into the Jira description"
        required: true
        default: plan
        type: choice
        options: [plan, publish]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: zerobug-${{ inputs.jira_id }}
  cancel-in-progress: false

env:
  PLANS_BRANCH: zerobug-plans
  # agent   = Copilot coding agent session on GitHub's infrastructure (default)
  # copilot = headless Copilot CLI session in this runner
  ZEROBUG_ENGINE: ${{ vars.ZEROBUG_ENGINE || 'agent' }}

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Inputs are never interpolated into shell scripts — they arrive as env vars and
      # are validated here before anything else uses them.
      - name: Validate input
        env:
          RAW_JIRA_ID: ${{ inputs.jira_id }}
        run: |
          JIRA_ID=$(printf '%s' "$RAW_JIRA_ID" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
          echo "$JIRA_ID" | grep -Eq '^[A-Z][A-Z0-9]+-[0-9]+$' || {
            echo "::error::Invalid Jira ID: $JIRA_ID"; exit 1;
          }
          echo "JIRA_ID=$JIRA_ID" >> "$GITHUB_ENV"

      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        working-directory: .github/zerobug
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check the engine credential
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          if [ "$ZEROBUG_ENGINE" = "copilot" ] && [ -z "$COPILOT_TOKEN" ]; then
            echo "::error::ZEROBUG_ENGINE=copilot needs COPILOT_TOKEN (fine-grained PAT with the Copilot Requests permission)."
            exit 1
          fi
          if [ "$ZEROBUG_ENGINE" = "agent" ] && [ -z "$AGENT_TOKEN" ] && [ -z "$COPILOT_TOKEN" ]; then
            echo "::error::ZEROBUG_ENGINE=agent needs AGENT_TOKEN (a PAT that can create issues and assign the Copilot coding agent)."
            exit 1
          fi

      - name: Install GitHub Copilot CLI
        if: env.ZEROBUG_ENGINE == 'copilot'
        run: npm install -g @github/copilot

      - name: Look for a plan the agent already produced (publish mode)
        if: inputs.mode == 'publish'
        run: |
          for REF in "origin/$PLANS_BRANCH" origin/main; do
            if git fetch origin "${REF#origin/}" --depth=1 2>/dev/null &&
               git show "$REF:plans/$JIRA_ID.json" > "$RUNNER_TEMP/existing-plan.json" 2>/dev/null; then
              echo "Found plans/$JIRA_ID.json on $REF"
              exit 0
            fi
          done
          echo "No stored plan found yet for $JIRA_ID"

      - name: Read Jira and run the analysis
        working-directory: .github/zerobug
        env:
          JIRA_ID: ${{ env.JIRA_ID }}
          MODE: ${{ inputs.mode }}
          PLAN_OUTPUT: ${{ runner.temp }}/plan.json
          EXISTING_PLAN_PATH: ${{ runner.temp }}/existing-plan.json
          # Jira MCP server (optional — empty means the REST path)
          JIRA_MCP_COMMAND: ${{ vars.JIRA_MCP_COMMAND }}
          JIRA_MCP_ARGS: ${{ vars.JIRA_MCP_ARGS }}
          # Jira REST / credentials the MCP server itself reads
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_USERNAME: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Coding agent: needs a real user PAT, the built-in token cannot assign the agent
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN || secrets.COPILOT_TOKEN }}
          # Copilot CLI reads COPILOT_GITHUB_TOKEN first, then GH_TOKEN / GITHUB_TOKEN
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_TIMEOUT_MS: '900000'
        run: node run.mjs

      # The agent engine produces no plan in this job — its session commits one later.
      - name: Commit the plan to the plans branch
        run: |
          if [ ! -f "$RUNNER_TEMP/plan.json" ]; then
            echo "No plan file in this run — nothing to commit."
            exit 0
          fi

          git config user.name "zerobug[bot]"
          git config user.email "zerobug@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$PLANS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PLANS_BRANCH:$PLANS_BRANCH"
            git worktree add "$RUNNER_TEMP/plansdir" "$PLANS_BRANCH"
          else
            git worktree add --detach "$RUNNER_TEMP/plansdir"
            git -C "$RUNNER_TEMP/plansdir" checkout --orphan "$PLANS_BRANCH"
            git -C "$RUNNER_TEMP/plansdir" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$RUNNER_TEMP/plansdir/plans"
          cp "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/plansdir/plans/$JIRA_ID.json"

          git -C "$RUNNER_TEMP/plansdir" add "plans/$JIRA_ID.json"
          git -C "$RUNNER_TEMP/plansdir" commit -m "ZeroBug: $JIRA_ID (${{ inputs.mode }})" \
            || echo "plan unchanged"
          git -C "$RUNNER_TEMP/plansdir" push origin "$PLANS_BRANCH"

      - name: Job summary
        if: always()
        run: |
          echo "## ZeroBug — $JIRA_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ inputs.mode }} · Engine: $ZEROBUG_ENGINE" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/plan.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 4000 "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
