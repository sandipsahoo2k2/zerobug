<header class="topbar">
  <div class="brand">
    <span class="mark">0</span>
    <div>
      <h1>ZeroBug</h1>
      <p>Jira ID in, step-by-step fix plan out.</p>
    </div>
  </div>

  <button
    type="button"
    class="settings-button"
    (click)="openSettings()"
    [attr.aria-expanded]="settingsOpen()"
    aria-label="Settings"
    title="Settings"
  >
    <span class="gear" aria-hidden="true">⚙</span>
    Settings
    @if (!isConfigured()) {
      <span class="dot" aria-hidden="true"></span>
    }
  </button>
</header>

@if (settingsOpen()) {
  <app-settings-panel (close)="closeSettings()" />
}

<main>
  <router-outlet />
</main>

<footer>
  Runs entirely on GitHub Pages + GitHub Actions. No server to host.
</footer>
